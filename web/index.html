<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Support Chats Viewer</title>
  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* minimal custom styles: scrollbar + subtle animation helpers */
    ::-webkit-scrollbar{width:10px;height:10px}
    ::-webkit-scrollbar-thumb{background:rgba(15,23,42,0.08);border-radius:9999px}
    .fade-in{animation:fadeIn .28s ease both}
    @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    html,body{height:100%;overflow:auto;margin:0}
    *,*::before,*::after{box-sizing:border-box}
  </style>
</head>
<body>
  <div class="min-h-screen max-h-screen overflow-hidden bg-gradient-to-b from-slate-50 via-slate-50 to-sky-50 p-6">
    <div class="max-w-7xl mx-auto h-full overflow-hidden">
      <div class="grid grid-cols-[360px_1fr] gap-6 h-full">
        <!-- LEFT: Ticket list -->
        <aside class="bg-transparent h-full">
          <div class="bg-white rounded-2xl shadow-md overflow-hidden h-full flex flex-col min-h-0">
            <div class="px-6 py-5 border-b border-slate-100">
              <div class="flex items-start justify-between">
                <div>
                  <div class="text-lg font-semibold text-slate-900">Support Cases</div>
                  <div class="text-sm text-slate-500 mt-1">Manage and respond to customer issues</div>
                </div>
                <div class="flex items-center gap-2">
                  <button id="changeCreds" class="text-sm text-slate-600 hover:bg-slate-50 px-3 py-2 rounded-md">Change</button>
                </div>
              </div>
            </div>

            <div class="px-4 py-3">
              <div class="relative">
                <svg class="w-5 h-5 absolute left-3 top-3 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M11 19a8 8 0 100-16 8 8 0 000 16z"/></svg>
                <input id="search" class="pl-10 pr-4 w-full rounded-full border border-slate-200 h-10 focus:ring-2 focus:ring-sky-200 focus:border-sky-300 shadow-sm" placeholder="Search title or description" />
              </div>
            </div>

            <div id="ticketList" class="flex-1 h-[500px] overflow-y-auto px-4 py-3 space-y-3 h-full min-h-0">
              <div class="text-sm text-slate-500 text-center py-12">Loading...</div>
            </div>
          </div>
        </aside>

        <!-- RIGHT: Ticket detail -->
        <section class="h-full">
          <div id="drawer" class="h-full bg-white/60 backdrop-blur rounded-2xl p-6 shadow-md flex flex-col fade-in min-h-0">
            <div class="flex-1 flex items-center justify-center text-slate-500">No ticket selected</div>
          </div>
        </section>
      </div>
    </div>
  </div>

  <script>
    // Simple file:// friendly support UI using Supabase REST API (no build, no modules)
    const params = new URLSearchParams(location.search);
    const paramUrl = params.get('url') || '';
    const paramKey = params.get('key') || '';

    function getCreds(){
      try{ return {url: localStorage.getItem('supabase_url') || paramUrl, key: localStorage.getItem('supabase_key') || paramKey}; }catch(e){return {url:paramUrl,key:paramKey}; }
    }

    function saveCreds(url,key){ try{ localStorage.setItem('supabase_url',url); localStorage.setItem('supabase_key',key);}catch(e){} }
    function clearCreds(){ try{ localStorage.removeItem('supabase_url'); localStorage.removeItem('supabase_key'); }catch(e){} location.reload(); }

    async function promptCreds(prefillUrl='', prefillKey=''){
      const url = prompt('Enter SUPABASE_URL', prefillUrl);
      if(!url) return null;
      const key = prompt('Enter SUPABASE_ANON_KEY', prefillKey);
      if(!key) return null;
      saveCreds(url,key);
      return {url,key};
    }

    // REST helper
    function rest(path, method='GET', body){
      const creds = getCreds();
      if(!creds.url || !creds.key) return Promise.reject(new Error('Missing credentials'));
      const url = creds.url.replace(/\/$/,'') + '/rest/v1/' + path;
      const headers = { 'apikey': creds.key, 'Authorization': 'Bearer ' + creds.key };
      if(body){ headers['Content-Type'] = 'application/json'; headers['Prefer'] = 'return=representation'; }
      return fetch(url, {method, headers, body: body?JSON.stringify(body):undefined}).then(async res=>{
        if(!res.ok){ const text = await res.text(); throw new Error(res.status + ' ' + res.statusText + ' ' + text); }
        const txt = await res.text(); try{ return JSON.parse(txt||'null'); }catch(e){ return txt; }
      });
    }

    // Rendering
    const ticketListEl = document.getElementById('ticketList');
    const drawer = document.getElementById('drawer');
    document.getElementById('changeCreds').addEventListener('click', ()=>{ clearCreds(); });

    // Height adjustment helpers to constrain panels to viewport after data loads
    function adjustListHeight(){
      try{
        const grid = document.querySelector('.grid'); if(!grid) return;
        const aside = document.querySelector('aside'); if(!aside) return;
        const header = aside.querySelector('.px-6');
        const search = aside.querySelector('.px-4');
        const gridH = grid.clientHeight;
        const headerH = header ? header.offsetHeight : 0;
        const searchH = search ? search.offsetHeight : 0;
        const extra = 32; // padding/margins
        // enforce fixed 500px height
        ticketListEl.style.height = '500px';
        ticketListEl.style.maxHeight = '500px';
        ticketListEl.style.overflowY = 'auto';
      }catch(e){ console.warn('adjustListHeight failed', e); }
    }

    function adjustDetailHeight(drawerEl, chatWrapEl, composerEl){
      try{
        const grid = document.querySelector('.grid'); if(!grid) return;
        const gridH = grid.clientHeight;
        const headerH = drawerEl.querySelector('.flex') ? drawerEl.querySelector('.flex').offsetHeight : 0;
        const metaEl = drawerEl.querySelector('.text-sm');
        const metaH = metaEl ? metaEl.offsetHeight : 0;
        const composerH = composerEl ? composerEl.offsetHeight : 0;
        const pad = 32;
        // enforce fixed 500px height for chat area
        if(chatWrapEl){ chatWrapEl.style.height = '500px'; chatWrapEl.style.maxHeight = '500px'; chatWrapEl.style.overflowY = 'auto'; }
      }catch(e){ console.warn('adjustDetailHeight failed', e); }
    }

    window.addEventListener('resize', ()=>{ adjustListHeight(); /* if a drawer is open, adjust detail height too */ const chat = document.querySelector('.chat'); if(chat && drawer) adjustDetailHeight(drawer, chat, drawer.querySelector('.composer')); });

    async function init(){
      let creds = getCreds();
      if(!creds.url || !creds.key){ const c = await promptCreds(paramUrl,paramKey); if(!c) { ticketListEl.innerHTML = '<div class="text-sm text-slate-500 text-center py-8">No credentials provided</div>'; return; } creds = c; }
      loadTickets();
    }

    function renderTicketRow(t, lastMsg, user){
      const el = document.createElement('div');
      el.className = 'ticket group relative bg-white rounded-xl p-4 shadow-sm hover:shadow-lg hover:-translate-y-0.5 transition-all duration-200 cursor-pointer flex justify-between items-start';

      const left = document.createElement('div'); left.className = 'ticket-left flex flex-col gap-1';
      const title = document.createElement('div'); title.className = 'title text-base font-semibold text-slate-900'; title.textContent = t.title || 'Untitled';
      const meta = document.createElement('div'); meta.className = 'meta text-xs text-slate-500'; meta.textContent = (user ? ((user.first_name||'') + ' ' + (user.last_name||'')) : (t.user_id || '')) + ' • ' + (t.application||'');
      left.appendChild(title); left.appendChild(meta);

      const right = document.createElement('div'); right.className = 'ticket-right flex flex-col items-end gap-2';
      const badge = document.createElement('div');
      const status = t.status || '';
      let statusCls = 'bg-slate-100 text-slate-700';
      if(status==='Open') statusCls = 'bg-red-50 text-red-700';
      else if(status==='In Progress') statusCls = 'bg-amber-50 text-amber-700';
      else if(status==='Resolved') statusCls = 'bg-green-50 text-green-700';
      else if(status==='Closed') statusCls = 'bg-slate-100 text-slate-600';
      badge.className = 'text-xs font-semibold px-3 py-1 rounded-full ' + statusCls;
      badge.textContent = status;

      const small = document.createElement('div'); small.className = 'small preview text-sm text-slate-500 truncate max-w-[220px]';
      // show the ticket creation datetime instead of last chat preview
      try{ small.textContent = t.created_at ? new Date(t.created_at).toLocaleString() : ''; }catch(e){ small.textContent = ''; }
      right.appendChild(badge); right.appendChild(small);

      el.appendChild(left); el.appendChild(right);
      // attach ticket id for later reference (update preview, etc.)
      try{ if(t && (t.id || t._id)) el.dataset.ticketId = t.id || t._id; }catch(e){}
      el.addEventListener('click', ()=> openTicket(t));
      return el;
    }

    async function loadTickets(){
      ticketListEl.innerHTML = '<div class="text-sm text-slate-500 text-center py-8">Loading tickets...</div>';
      try{
        // basic fetch: get recent tickets
        const tickets = await rest('ticket?select=*&order=created_at.desc&limit=200');
        if(!Array.isArray(tickets) || tickets.length===0){ ticketListEl.innerHTML = '<div class="text-sm text-slate-500 text-center py-8">No tickets</div>'; return; }
        ticketListEl.innerHTML = '';
        // fetch last chat for these tickets (limited approach)
        const chatResp = await rest(`ticket_chat?select=*&order=created_at.desc&limit=1000`).catch(()=>[]);
        const lastMap = {};
        if(Array.isArray(chatResp)) chatResp.forEach(m=>{ if(!lastMap[m.ticket_id]) lastMap[m.ticket_id]=m; });
        // fetch users
        const userIds = [...new Set(tickets.map(t=>t.user_id).filter(Boolean))];
        let users = [];
        if(userIds.length>0) users = await rest(`User?select=*&in(user_id,(${userIds.join(',')}))`).catch(()=>[]);
        const userMap = {};
        if(Array.isArray(users)) users.forEach(u=> userMap[u.user_id]=u);

        tickets.forEach(t=>{
          const row = renderTicketRow(t, lastMap[t.id], userMap[t.user_id]);
          ticketListEl.appendChild(row);
        });
        // adjust list height now that items are rendered
        adjustListHeight();
      }catch(err){ ticketListEl.innerHTML = '<div class="text-sm text-red-600 text-center py-6">Error loading tickets: '+escapeHtml(err.message)+'</div>'; console.error(err); }
    }

    async function openTicket(t){
      drawer.innerHTML = '';
      const header = document.createElement('div'); header.className = 'flex items-start justify-between gap-4';
      const left = document.createElement('div'); left.className = 'flex-1'; left.innerHTML = `<div class="text-lg font-semibold text-slate-900">${escapeHtml(t.title||'Untitled')}</div><div class="text-sm text-slate-500 mt-2">${escapeHtml(t.description||'')}</div>`;
      const right = document.createElement('div');
      const statusSelect = document.createElement('select'); ['Open','In Progress','Resolved','Closed'].forEach(s=>{ const o=document.createElement('option'); o.value=s; o.textContent=s; if(s===t.status) o.selected=true; statusSelect.appendChild(o); });
      statusSelect.className = 'rounded-md border border-slate-200 px-2 py-1 bg-white';
      statusSelect.addEventListener('change', async ()=>{
        try{ await rest(`ticket?id=eq.${t.id}`, 'PATCH', {status: statusSelect.value}); alert('Status updated'); loadTickets(); }catch(e){ alert('Update failed: '+e.message); }
      });
      right.appendChild(statusSelect);
      // delete thread button (deletes all messages for this ticket)
      const deleteThreadBtn = document.createElement('button');
      deleteThreadBtn.className = 'ml-3 inline-flex items-center gap-2 text-sm text-red-600 hover:text-white hover:bg-red-600 px-3 py-1 rounded-md border border-red-100';
      deleteThreadBtn.textContent = 'Delete Thread';
      deleteThreadBtn.addEventListener('click', async (ev)=>{
        ev.stopPropagation();
        if(!confirm('Delete this support case and all its messages? This cannot be undone.')) return;
        try{
          // delete associated chats
          await rest(`ticket_chat?ticket_id=eq.${t.id}`, 'DELETE');
          // delete the ticket itself
          await rest(`ticket?id=eq.${t.id}`, 'DELETE');

          // remove ticket row from list
          try{
            const row = document.querySelector(`[data-ticket-id="${t.id}"]`);
            if(row && row.parentNode) row.parentNode.removeChild(row);
          }catch(e){ console.warn('Failed to remove ticket row', e); }

          // clear the chat UI and reset drawer
          try{
            if(chatWrap) chatWrap.innerHTML = '<div class="text-sm text-slate-500">No messages</div>';
            drawer.innerHTML = '<div class="flex-1 flex items-center justify-center text-slate-500">No ticket selected</div>';
          }catch(e){}

          alert('Support case deleted');
        }catch(err){ alert('Failed to delete case: '+(err.message||err)); }
      });
      right.appendChild(deleteThreadBtn);
      header.appendChild(left); header.appendChild(right);
      drawer.appendChild(header);

      const meta = document.createElement('div'); meta.className='text-sm text-slate-500 mt-3'; meta.textContent = 'Created: ' + new Date(t.created_at).toLocaleString() + ' • Application: ' + (t.application||'');
      drawer.appendChild(meta);

      const chatWrap = document.createElement('div'); chatWrap.className='chat flex-1 h-[500px] overflow-y-auto flex flex-col gap-4 p-3 mt-4';
      chatWrap.innerHTML = '<div class="text-sm text-slate-500">Loading messages...</div>';
      drawer.appendChild(chatWrap);

      // composer
      const comp = document.createElement('div'); comp.className='composer mt-4 bg-white rounded-full shadow-md p-2 flex items-center gap-3';
      const inp = document.createElement('input'); inp.className='flex-1 px-4 py-2 rounded-full border border-slate-200 focus:outline-none focus:ring-2 focus:ring-sky-200'; inp.placeholder='Write a message...';
      const send = document.createElement('button'); send.className='inline-flex items-center justify-center bg-sky-600 hover:bg-sky-700 text-white rounded-full px-4 py-2 shadow-md transform active:scale-95'; send.innerHTML = 'Send';
      comp.appendChild(inp); comp.appendChild(send);
      drawer.appendChild(comp);

      // load chats
      try{
        const chats = await rest(`ticket_chat?ticket_id=eq.${t.id}&order=created_at.asc`).catch(()=>[]);
        chatWrap.innerHTML = '';
        if(Array.isArray(chats) && chats.length){
          chats.forEach(m=>{
            const b = document.createElement('div');
            const msgId = m.id || m.message_id || m._id || null;
            if(m.user_role==='support'){
              b.className = 'bubble row-support max-w-[70%] p-3 rounded-2xl bg-gradient-to-br from-blue-500 to-blue-600 text-white self-end shadow-lg transform transition-all relative';
            } else {
              b.className = 'bubble row-customer max-w-[70%] p-3 rounded-2xl bg-white border border-slate-200 text-slate-900 self-start shadow relative';
            }
            if(msgId) b.dataset.msgId = msgId;
            const txt = document.createElement('div'); txt.innerHTML = escapeHtml(m.chat || '');

            // delete button
            const delBtn = document.createElement('button');
            delBtn.className = 'absolute -top-2 -right-2 w-7 h-7 inline-flex items-center justify-center rounded-full bg-white/80 hover:bg-white text-slate-500 hover:text-red-600 transition';
            delBtn.title = 'Delete message';
            delBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6M1 7h22M8 7V4a1 1 0 011-1h6a1 1 0 011 1v3"/></svg>';
            delBtn.addEventListener('click', async (ev)=>{
              ev.stopPropagation();
              const id = b.dataset.msgId;
              if(!confirm('Delete this message? This action cannot be undone.')) return;
              if(!id){ b.remove(); return; }
              try{
                await rest(`ticket_chat?id=eq.${id}`, 'DELETE');
                b.remove();
              }catch(err){ alert('Delete failed: '+(err.message||err)); }
            });

            const ts = document.createElement('div'); ts.className='text-xs text-slate-400 mt-2'; ts.textContent = (m.user_role||'') + ' • ' + new Date(m.created_at).toLocaleString();
            b.appendChild(txt); b.appendChild(ts); b.appendChild(delBtn);
            chatWrap.appendChild(b);
          });
        } else chatWrap.innerHTML = '<div class="text-sm text-slate-500">No messages</div>';
        // adjust chat height now that messages are added
        adjustDetailHeight(drawer, chatWrap, comp);
      }catch(err){ chatWrap.innerHTML = '<div class="text-sm text-red-600">Error loading chats: '+escapeHtml(err.message)+'</div>'; }

      send.addEventListener('click', async ()=>{
        const text = inp.value.trim(); if(!text) return; send.disabled=true; try{
          const payload = { ticket_id: t.id, user_id: null, user_role: 'support', chat: text };
            const res = await rest('ticket_chat', 'POST', payload);
            // append optimistic with delete control
            const created = (Array.isArray(res) && res[0]) ? res[0] : res;
            const newId = created && (created.id || created._id || created.message_id) ? (created.id || created._id || created.message_id) : null;
            const b = document.createElement('div');
            b.className = 'bubble row-support max-w-[70%] p-3 rounded-2xl bg-gradient-to-br from-blue-500 to-blue-600 text-white self-end shadow-lg relative';
            if(newId) b.dataset.msgId = newId;
            const txt = document.createElement('div'); txt.innerHTML = escapeHtml((created && created.chat) ? created.chat : text);
            const ts = document.createElement('div'); ts.className='text-xs text-slate-400 mt-2'; ts.textContent = 'support • ' + new Date().toLocaleString();
            const delBtn = document.createElement('button');
            delBtn.className = 'absolute -top-2 -right-2 w-7 h-7 inline-flex items-center justify-center rounded-full bg-white/80 hover:bg-white text-slate-500 hover:text-red-600 transition';
            delBtn.title = 'Delete message';
            delBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6M1 7h22M8 7V4a1 1 0 011-1h6a1 1 0 011 1v3"/></svg>';
            delBtn.addEventListener('click', async (ev)=>{ ev.stopPropagation(); if(!confirm('Delete this message? This action cannot be undone.')) return; const id = b.dataset.msgId; if(!id){ b.remove(); return; } try{ await rest(`ticket_chat?id=eq.${id}`, 'DELETE'); b.remove(); }catch(err){ alert('Delete failed: '+(err.message||err)); } });
            b.appendChild(txt); b.appendChild(ts); b.appendChild(delBtn); chatWrap.appendChild(b); inp.value='';
        }catch(e){ alert('Send failed: '+e.message); }
        finally{ send.disabled=false; }
      });
    }

    function escapeHtml(s){ return (s||'').toString().replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]||c)); }

    // wire search
    document.addEventListener('input', (e)=>{
      if(e.target && e.target.id === 'search'){
        const q = document.getElementById('search').value.trim().toLowerCase();
        const rows = Array.from(document.querySelectorAll('.ticket'));
        rows.forEach(r=>{ const t = (r.querySelector('.title') && r.querySelector('.title').textContent || '').toLowerCase(); r.style.display = t.includes(q) ? '' : 'none'; });
      }
    });

    // start
    init();
  </script>
</body>
</html>
