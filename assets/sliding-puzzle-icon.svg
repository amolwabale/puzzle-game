<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <rect width="100%" height="100%" rx="160" fill="#071133" />

  <!-- 3x3 grid outer margin -->
  <g transform="translate(140,140)">
    <rect width="744" height="744" rx="56" fill="#0b1220" />
    <!-- tiles -->
    <g stroke="#081026" stroke-width="6">
      <!-- row 1 -->
      <rect x="0" y="0" width="240" height="240" rx="24" fill="#06b6d4" />
      <rect x="252" y="0" width="240" height="240" rx="24" fill="#ffd166" />
      <rect x="504" y="0" width="240" height="240" rx="24" fill="#ef476f" />
      <!-- row 2 -->
      <rect x="0" y="252" width="240" height="240" rx="24" fill="#118ab2" />
      <rect x="252" y="252" width="240" height="240" rx="24" fill="#8bd3dd" />
      <rect x="504" y="252" width="240" height="240" rx="24" fill="#ffd166" />
      <!-- row 3 -->
      <rect x="0" y="504" width="240" height="240" rx="24" fill="#ef476f" />
      <rect x="252" y="504" width="240" height="240" rx="24" fill="#06b6d4" />
      <!-- empty tile bottom-right left transparent to show gap -->
      <rect x="504" y="504" width="240" height="240" rx="24" fill="#071133" />
    </g>

    <!-- numbers -->
    <g font-family="Inter, Roboto, Arial, sans-serif" fill="#061014" font-weight="800" font-size="96" text-anchor="middle">
      <text x="120" y="150">1</text>
      <text x="372" y="150">2</text>
      <text x="624" y="150">3</text>
      <text x="120" y="402">4</text>
      <text x="372" y="402">5</text>
      <text x="624" y="402">6</text>
      <text x="120" y="654">7</text>
      <text x="372" y="654">8</text>
    </g>
  </g>

  <!-- subtle glossy highlight -->
  <ellipse cx="600" cy="200" rx="300" ry="120" fill="rgba(255,255,255,0.035)" />
</svg>
